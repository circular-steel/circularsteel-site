backend:
  name: github
  repo: circular-steel/circularsteel-site
  branch: main
  base_url: https://circularsteel.netlify.app
  auth_endpoint: .netlify/functions/auth

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    editor: { preview: false }
    files:
      - name: "banner"
        label: "Promotional Banner"
        file: "src/_data/banner.json"
        description: "The thin bar at the very top of the site. Set a global one for everywhere, and/or separate ones for just the UK or USA pages - if both a region banner and the global one are switched on for the same page, the region one wins."
        fields:
          - label: "Sitewide (shows everywhere unless a region banner below overrides it)"
            name: "global"
            widget: "object"
            fields:
              - { label: "Show this banner", name: "enabled", widget: "boolean", default: false }
              - { label: "Text", name: "text", widget: "string", required: false }
              - { label: "Link label", name: "linkLabel", widget: "string", required: false, hint: "e.g. 'Get tickets'" }
              - { label: "Link URL", name: "linkUrl", widget: "string", required: false }
          - label: "UK pages only (the /uk/ hub and every UK event page)"
            name: "uk"
            widget: "object"
            fields:
              - { label: "Show this banner", name: "enabled", widget: "boolean", default: false }
              - { label: "Text", name: "text", widget: "string", required: false }
              - { label: "Link label", name: "linkLabel", widget: "string", required: false }
              - { label: "Link URL", name: "linkUrl", widget: "string", required: false }
          - label: "USA pages only (the /usa/ hub and every USA event page)"
            name: "usa"
            widget: "object"
            fields:
              - { label: "Show this banner", name: "enabled", widget: "boolean", default: false }
              - { label: "Text", name: "text", widget: "string", required: false }
              - { label: "Link label", name: "linkLabel", widget: "string", required: false }
              - { label: "Link URL", name: "linkUrl", widget: "string", required: false }

      - name: "programmePartners"
        label: "Programme Partners & Sponsors"
        file: "src/_data/programmePartners.json"
        description: "Sponsors shown on pages that aren't about one specific event — the homepage, the /uk/ hub, the /usa/ hub, and the Reuse Playbook section. For sponsors on a specific event page, add them under that event instead."
        fields:
          - label: "Homepage"
            name: "global"
            widget: "list"
            required: false
            hint: "Shows on the homepage, above the general sponsor logo wall."
            fields: &partner_fields
              - { label: "Sponsor", name: "sponsor", widget: "relation", collection: "sponsors", search_fields: ["title"], display_fields: ["title"], value_field: "slug" }
              - { label: "Tier", name: "tier", widget: "relation", collection: "tiers", search_fields: ["name"], display_fields: ["name"], value_field: "name", hint: "Don't see the tier you need? Add it under the Sponsor Tiers collection first, then come back here." }
              - { label: "Note (optional)", name: "note", widget: "text", required: false }
          - label: "UK hub (/uk/)"
            name: "uk"
            widget: "list"
            required: false
            hint: "Shows on the /uk/ page itself — not on individual UK event pages."
            fields: *partner_fields
          - label: "USA hub (/usa/)"
            name: "usa"
            widget: "list"
            required: false
            hint: "Shows on the /usa/ page itself — not on individual USA event pages."
            fields: *partner_fields
          - label: "Reuse Playbook"
            name: "playbook"
            widget: "list"
            required: false
            hint: "Shows in the Reuse Playbook section of the homepage. Reuse Playbook has its own separate site — this just credits its sponsors here too."
            fields: *partner_fields

  - name: "pages"
    label: "Page Content"
    editor: { preview: false }
    description: "The wording on each page - headings, intro paragraphs, etc. Structural bits (forms, event cards, focus-point tiles) aren't editable here, just the surrounding copy."
    files:
      - name: "home"
        label: "Homepage"
        file: "src/_data/pages/home.json"
        fields:
          - { label: "Hero heading", name: "heroTitle", widget: "string" }
          - { label: "Hero subtext", name: "heroLede", widget: "text" }
          - { label: "Intro paragraph (below the hero)", name: "introText", widget: "text" }
          - { label: "\"Why it matters\" heading", name: "whyMattersHeading", widget: "string" }
          - { label: "\"Why it matters\" paragraph 1", name: "whyMattersBody1", widget: "text" }
          - { label: "\"Why it matters\" paragraph 2 (after \"A platform built around action.\")", name: "whyMattersBody2", widget: "text" }
          - { label: "UK series description", name: "twoSeriesUkText", widget: "text" }
          - { label: "USA series description", name: "twoSeriesUsaText", widget: "text" }
      - name: "uk"
        label: "UK Hub Page (/uk/)"
        file: "src/_data/pages/uk.json"
        fields:
          - { label: "Hero heading", name: "heroTitle", widget: "string" }
          - { label: "Hero subtext", name: "heroLede", widget: "text" }
          - { label: "Focus section intro", name: "focusIntro", widget: "text" }
          - { label: "\"Who attends\" paragraph (after \"Who attends.\")", name: "whoAttends", widget: "text" }
      - name: "usa"
        label: "USA Hub Page (/usa/)"
        file: "src/_data/pages/usa.json"
        fields:
          - { label: "Hero heading", name: "heroTitle", widget: "string" }
          - { label: "Hero subtext", name: "heroLede", widget: "text" }
          - { label: "Focus section intro", name: "focusIntro", widget: "text" }
          - { label: "Closing paragraph", name: "closingText", widget: "text" }
      - name: "about"
        label: "About Page"
        file: "src/_data/pages/about.json"
        fields:
          - { label: "Hero heading", name: "heroTitle", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown", hint: "Supports headings, bold, and links, same as an event or sponsor body." }
      - name: "contact"
        label: "Contact Page"
        file: "src/_data/pages/contact.json"
        fields:
          - { label: "Hero heading", name: "heroTitle", widget: "string" }
          - { label: "Hero subtext", name: "heroLede", widget: "text" }
      - name: "resources"
        label: "Resources Page"
        file: "src/_data/pages/resources.json"
        fields:
          - { label: "Hero heading", name: "heroTitle", widget: "string" }
          - { label: "Hero subtext", name: "heroLede", widget: "text" }
      - name: "help"
        label: "Help Page"
        file: "src/_data/pages/help.json"
        fields:
          - { label: "Hero heading", name: "heroTitle", widget: "string" }
          - { label: "Hero subtext", name: "heroLede", widget: "text" }

  - name: "events"
    label: "Events"
    folder: "src/events"
    create: true
    identifier_field: title
    slug: "{{year}}-{{region}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "e.g. uk-2026 — internal identifier, not shown publicly" }
      - { label: "Region", name: "region", widget: "select", options: ["uk", "usa"] }
      - { label: "Year", name: "year", widget: "number", valueType: "int" }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. 2026-06-24 or a text description" }
      - { label: "Time (optional)", name: "time", widget: "string", required: false, hint: "e.g. 08:00–14:30 — only needed for something like a half-day event. Shown next to the date." }
      - { label: "Venue", name: "venue", widget: "string", required: false }
      - { label: "Status", name: "status", widget: "select", options: ["upcoming", "past"] }
      - { label: "Feature image", name: "image", widget: "image", required: false, hint: "Shown on the UK/USA hub page for the two most recent events." }
      - { label: "Summary (shown on the UK/USA hub list)", name: "summary", widget: "text" }
      - label: "Sponsors"
        name: "sponsors"
        widget: "list"
        required: false
        hint: "Pick an existing sponsor profile — create it first under the Sponsors collection if it doesn't exist yet."
        fields:
          - { label: "Sponsor", name: "sponsor", widget: "relation", collection: "sponsors", search_fields: ["title"], display_fields: ["title"], value_field: "slug" }
          - { label: "Tier", name: "tier", widget: "relation", collection: "tiers", search_fields: ["name"], display_fields: ["name"], value_field: "name", hint: "Don't see the tier you need? Add it under the Sponsor Tiers collection first, then come back here." }
          - { label: "Note (optional, specific to this event)", name: "note", widget: "text", required: false }
      - label: "Video gallery"
        name: "videos"
        widget: "list"
        required: false
        hint: "Click-to-play video tiles (e.g. session recordings, sponsor films). Doesn't autoplay, so it's safe to add lots."
        fields:
          - { label: "YouTube video ID", name: "id", widget: "string", hint: "The part after v= or youtu.be/, e.g. W3pWW-oixjE" }
          - { label: "Label", name: "label", widget: "string" }
      - { label: "Video gallery heading (optional)", name: "videos_title", widget: "string", required: false, hint: "Defaults to 'More from the day' if left blank." }
      - { label: "Downloads display style", name: "download_style", widget: "select", options: ["list", "tile"], default: "list", required: false, hint: "'list' is a compact wide row per download; 'tile' is a squarer card with a bigger colour accent." }
      - label: "Downloads"
        name: "downloads"
        widget: "list"
        required: false
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "File", name: "url", widget: "file", required: false }
          - { label: "One-line description (optional)", name: "description", widget: "string", required: false }
          - { label: "Accent colour (optional hex, e.g. #00b3e0)", name: "color", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "sponsors"
    label: "Sponsors"
    folder: "src/sponsors"
    create: true
    identifier_field: title
    slug: "{{slug}}"
    fields:
      - { label: "Company name", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string", hint: "URL-friendly, e.g. cleveland-steel-tubes — used to link this sponsor to events" }
      - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Any size, shape or file type is fine (PNG, JPG, SVG, WEBP) — it's automatically fitted into a consistent box on the site, no need to crop or resize first. Transparent background looks cleanest but isn't required." }
      - { label: "Website", name: "website", widget: "string", required: false }
      - { label: "Feature page", name: "featured", widget: "boolean", default: false, hint: "Switch this on to unlock a richer profile page for this sponsor — a banner photo below and a photo gallery further down, plus more room to write in the body text. Leave off for the standard simple page. Good for Platinum/headline sponsors who've given you more to work with." }
      - { label: "Banner photo (only shown if Feature page is on)", name: "heroImage", widget: "image", required: false, hint: "A wide photo, e.g. their team at the event or a project shot. Shown behind the page title." }
      - label: "Photo gallery (only shown if Feature page is on)"
        name: "gallery"
        widget: "list"
        required: false
        hint: "As many photos as you like."
        fields:
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Caption (optional)", name: "caption", widget: "string", required: false }
      - label: "Contacts"
        name: "contacts"
        widget: "list"
        required: false
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string", required: false }
      - { label: "About / body copy", name: "body", widget: "markdown", hint: "Standard sponsors: a paragraph or two. Feature page sponsors: write as much as you like here — headings, bold, links and images are all supported." }

  - name: "tiers"
    label: "Sponsor Tiers"
    folder: "src/tiers"
    create: true
    identifier_field: name
    slug: "{{name}}"
    fields:
      - { label: "Name", name: "name", widget: "string", hint: "Exactly as it should appear, e.g. 'Platinum' — this is what you'll pick from the Tier dropdown on each event's sponsors." }
      - { label: "Colour (gradient start)", name: "color", widget: "color", hint: "The sponsor card's ribbon is a two-colour gradient between this and the colour below." }
      - { label: "Colour (gradient end)", name: "color2", widget: "color", hint: "Second colour for the gradient. Fine to set the same as above for a flat colour." }
      - { label: "Display order (lower shows first)", name: "order", widget: "number", valueType: "int", default: 99 }
