<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Steel — New Site Coming Soon</title>
<meta name="description" content="Circular Steel is the leading industry platform dedicated to advancing the reuse of structural steel. A new site is on its way.">
<link rel="icon" type="image/png" href="images/circular-steel-logo.png">
<style>
  :root {
    --navy: #002c6a;
    --cyan: #00b3e0;
    --accent: #ff2600;
    --ink: #0d1b33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vh 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% -10%, #eaf6ff 0%, #ffffff 55%);
    color: var(--ink);
  }
  .logo {
    width: 180px;
    height: auto;
    margin-bottom: 32px;
  }
  h1 {
    font-size: clamp(28px, 5vw, 44px);
    line-height: 1.15;
    color: var(--navy);
    margin: 0 0 16px;
    letter-spacing: -0.01em;
  }
  p.lede {
    font-size: 18px;
    line-height: 1.6;
    max-width: 560px;
    color: #3a4a63;
    margin: 0 0 40px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--cyan);
    background: #f0fbff;
    border: 1px solid #cdeef9;
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 40px;
  }
  .status::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .links a {
    color: var(--navy);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 12px 22px;
    border: 1.5px solid var(--navy);
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .links a:hover {
    background: var(--navy);
    color: #fff;
  }
  footer {
    margin-top: 64px;
    font-size: 13px;
    color: #8a96a8;
  }
</style>
</head>
<body>
  <img class="logo" src="images/circular-steel-logo.png" alt="Circular Steel">
  <div class="status">Rebuild in progress</div>
  <h1>Shaping the future of steel reuse</h1>
  <p class="lede">
    We're rebuilding this site from the ground up. In the meantime, catch up on the latest
    from Circular Steel or get in touch below.
  </p>
  <div class="links">
    <a href="https://circularsteel.substack.com/" target="_blank" rel="noopener">Read the Newsletter</a>
    <a href="https://www.linkedin.com/company/circularsteel/" target="_blank" rel="noopener">Follow on LinkedIn</a>
    <a href="https://www.linkedin.com/groups/12679217/" target="_blank" rel="noopener">Join the LinkedIn Group</a>
  </div>
  <footer>&copy; 2026 Circular Steel</footer>
</body>
</html>
